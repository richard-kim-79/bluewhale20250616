name: Frontend Deploy to Vercel

on:
  push:
    branches: [staging, main, clean-staging, workflows-only]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch: # 수동 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run tests
        run: npm test
        working-directory: ./frontend
        continue-on-error: true

      - name: Set environment variables
        id: set_env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "VERCEL_ENV=production" >> $GITHUB_ENV
            echo "vercel_env=production" >> $GITHUB_OUTPUT
          else
            echo "VERCEL_ENV=preview" >> $GITHUB_ENV
            echo "vercel_env=preview" >> $GITHUB_OUTPUT
          fi
          echo "Deploying to Vercel environment: ${{ env.VERCEL_ENV }}"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: ${{ env.VERCEL_ENV == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: ${{ steps.set_env.outputs.vercel_env == 'production' && secrets.VERCEL_DOMAIN || format('{0}-staging', secrets.VERCEL_DOMAIN) }}
