name: Backend Deploy

on:
  push:
    branches: [staging, main, clean-staging, workflows-only]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch: # 수동 실행 가능

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # AWS 자격 증명을 환경 변수로 설정
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # 기본 환경 변수 설정
      - name: Set basic environment variables
        run: |
          echo "ENV_NAME=staging" >> $GITHUB_ENV
          echo "ECS_CLUSTER=bluewhale-staging" >> $GITHUB_ENV
          echo "ECS_SERVICE=bluewhale-backend-staging" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=bluewhale-backend" >> $GITHUB_ENV

      # 디버그용 - AWS 자격 증명 테스트
      - name: Debug - Verify AWS credentials
        run: |
          aws configure list
          aws sts get-caller-identity || echo "AWS 자격 증명 실패"
          
      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          # Build a docker container and push it to ECR
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -t $ECR_REGISTRY/$ECR_REPOSITORY:latest-$ENV_NAME ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest-$ENV_NAME
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./aws/task-definition-template.json
          container-name: bluewhale-backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Post-deployment health check
        run: |
          # Wait for service to stabilize
          sleep 30
          
          # Get the load balancer URL from ECS service
          if [[ "$ENV_NAME" == "production" ]]; then
            API_URL=${{ secrets.PROD_API_URL }}
          else
            API_URL=${{ secrets.STAGING_API_URL }}
          fi
          
          # Check health endpoint
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $API_URL/health || echo "failed")
          
          if [[ "$HEALTH_STATUS" == "200" ]]; then
            echo "Health check passed! API is responding correctly."
          else
            echo "Health check failed with status: $HEALTH_STATUS"
            echo "Initiating rollback..."
            exit 1
          fi
