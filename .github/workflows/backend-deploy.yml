name: Backend Deploy

on:
  push:
    branches: [staging, main, clean-staging, workflows-only]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch: # 수동 실행 가능

env:
  # 기본 AWS 리전 설정 (각 환경별로 오버라이드 가능)
  AWS_REGION: ap-northeast-2  # 기본값: 서울 리전
  # 각 환경별 AWS 리전 매핑
  PROD_AWS_REGION: us-east-1   # 프로덕션: 버지니아 리전
  STAGING_AWS_REGION: us-west-2  # 스테이징: 오레곤 리전
  DEV_AWS_REGION: ap-northeast-2  # 개발: 서울 리전
  # 백업 리전 (장애 발생 시 사용)
  BACKUP_AWS_REGION: eu-central-1  # 백업: 프랑크푸르트 리전

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set environment variables based on branch
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "AWS_REGION=${{ env.PROD_AWS_REGION }}" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${{ secrets.PROD_ECS_CLUSTER }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.PROD_ECS_SERVICE }}" >> $GITHUB_ENV
          elif [[ ${{ github.ref }} == 'refs/heads/staging' ]]; then
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "AWS_REGION=${{ env.STAGING_AWS_REGION }}" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${{ secrets.STAGING_ECS_CLUSTER }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.STAGING_ECS_SERVICE }}" >> $GITHUB_ENV
          else
            echo "ENV_NAME=development" >> $GITHUB_ENV
            echo "AWS_REGION=${{ env.DEV_AWS_REGION }}" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${{ secrets.STAGING_ECS_CLUSTER }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.STAGING_ECS_SERVICE }}" >> $GITHUB_ENV
          fi
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set environment variables based on branch
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${{ secrets.PROD_ECS_CLUSTER }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.PROD_ECS_SERVICE }}" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV  # 프로덕션용 리전
          elif [[ ${{ github.ref }} == 'refs/heads/staging' ]]; then
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${{ secrets.STAGING_ECS_CLUSTER }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.STAGING_ECS_SERVICE }}" >> $GITHUB_ENV
            echo "AWS_REGION=us-west-2" >> $GITHUB_ENV  # 스테이징용 리전
          else
            echo "ENV_NAME=development" >> $GITHUB_ENV
            echo "ECS_CLUSTER=${{ secrets.STAGING_ECS_CLUSTER }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.STAGING_ECS_SERVICE }}" >> $GITHUB_ENV
            echo "AWS_REGION=ap-northeast-2" >> $GITHUB_ENV  # 개발용 리전 (서울)
          fi
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          # Build a docker container and push it to ECR
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -t $ECR_REGISTRY/$ECR_REPOSITORY:latest-$ENV_NAME ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest-$ENV_NAME
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./aws/task-definition-template.json
          container-name: bluewhale-backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Post-deployment health check
        run: |
          # Wait for service to stabilize
          sleep 30
          
          # Get the load balancer URL from ECS service
          if [[ "$ENV_NAME" == "production" ]]; then
            API_URL=${{ secrets.PROD_API_URL }}
          else
            API_URL=${{ secrets.STAGING_API_URL }}
          fi
          
          # Check health endpoint
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $API_URL/health || echo "failed")
          
          if [[ "$HEALTH_STATUS" == "200" ]]; then
            echo "Health check passed! API is responding correctly."
          else
            echo "Health check failed with status: $HEALTH_STATUS"
            echo "Initiating rollback..."
            exit 1
          fi
